[tool.poetry]
package-mode = false

[project]
name = "maitawn"
version = "0.1.0"
description = "API permettant de faire la veille de certainnes activités de la mairie (poubelles, naissances, éclairage)"
authors = [
    {name = "Bogangwack",email = "therrynganga5@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.129.0,<0.130.0)",
    "uvicorn[standard] (>=0.40.0,<0.41.0)",
    "sqlalchemy (>=2.0.46,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "pydantic[email] (>=2.12.5,<3.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "pyjwt (>=2.11.0,<3.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "redis (>=7.1.1,<8.0.0)",
    "fastapi-cache2 (>=0.2.2,<0.3.0)",
    "python-multipart (>=0.0.22,<0.0.23)",
    "firebase-admin (>=7.1.0,<8.0.0)",
    "apscheduler (>=3.11.2,<4.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "boto3 (>=1.42.49,<2.0.0)",
    "pendulum (>=3.2.0,<4.0.0)",
    "geohash2 (>=1.1,<2.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "factory-boy (>=3.3.3,<4.0.0)"
]
